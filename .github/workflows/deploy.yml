name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            PROJECT_DIR="/opt/docker/apps/${{ github.event.repository.name }}"

            # 1. Clone or pull the repository
            if [ ! -d "$PROJECT_DIR" ]; then
              mkdir -p "$PROJECT_DIR"
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git reset --hard HEAD
            git pull origin main

            # 2. Ensure the external network exists
            docker network create web || true

            # 3. Levantar contenedores especificando el archivo de PRODUCCIÓN
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            # 4. Ejecutar migraciones de la base de datos (forzadas para producción)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web php artisan migrate --force

            # 5. Optimizar Laravel para producción
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web php artisan config:cache
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web php artisan route:cache
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web php artisan view:cache

            # 6. Limpieza de imágenes antiguas para no saturar el disco del VPS
            docker image prune -f
