name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Runtime del server: Podman rootful (Docker ya no se usa).
            export DOCKER_HOST="unix:///run/podman/podman.sock"
            PROJECT_DIR="/opt/docker/apps/${{ github.event.repository.name }}"

            # 1. Clone or pull the repository
            if [ ! -d "$PROJECT_DIR" ]; then
              mkdir -p "$PROJECT_DIR"
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git pull origin main

            # 2. Ensure the external network exists
            podman network create web || true

            # 3. Levantar contenedores de PRODUCCIÓN (Podman).
            #    Importante: el service nginx (store-nginx) vive SOLO en
            #    docker-compose.prod.yml; por eso SIEMPRE los tres archivos.
            #    Con solo yml+prod el proxy central crashea en bucle con
            #    "[emerg] host not found in upstream" porque store-nginx no existe.
            #    Los assets (vite/tailwind/daisyui) se compilan DENTRO de
            #    Dockerfile.prod (etapa node) y store-nginx los sirve desde el
            #    volumen compartido store-build. El host no necesita node.
            podman compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.prod.yml up -d --build

            # 4. Ejecutar migraciones de la base de datos (forzadas para producción)
            podman compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.prod.yml exec -T web php artisan migrate --force

            # 5. Optimizar Laravel para producción
            podman compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.prod.yml exec -T web php artisan config:cache
            podman compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.prod.yml exec -T web php artisan route:cache
            podman compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.prod.yml exec -T web php artisan view:cache

            # 6. Reiniciar el proxy central SIEMPRE AL FINAL.
            #    nginx resuelve los upstreams (store-nginx, landing-page) solo al
            #    arrancar; si una recreación cambió la IP del contenedor en la red
            #    "web", sin este restart el sitio queda apuntando a una IP muerta.
            podman restart nginx-proxy

            # 7. Smoke test: la cadena completa (proxy → store-nginx → web → db).
            #    Retry: `podman restart` devuelve con el contenedor arrancado, pero
            #    nginx tarda en bindear el 443; el primer intento suele fallar.
            #    -k: el origin va detrás de Cloudflare, así que sirve un Origin
            #    Certificate sin cadena pública completa; la confianza TLS la
            #    resuelve el edge, acá solo se valida la conectividad interna.
            ok=""
            for i in $(seq 1 10); do
              if curl -skSf --resolve lion.cortez-dev.com:443:127.0.0.1 https://lion.cortez-dev.com/ >/dev/null 2>&1; then
                ok=1
                break
              fi
              echo "SMOKE TEST: esperando al proxy (intento $i/10)..."
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "SMOKE TEST FALLÓ"
              podman logs --tail 20 nginx-proxy
              exit 1
            fi
            echo "SMOKE TEST OK"

            # 8. Limpieza de imágenes antiguas para no saturar el disco del VPS
            podman image prune -f