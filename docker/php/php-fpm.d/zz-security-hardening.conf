; ==========================================================================
; Pool de FPM: hardening para CVE-2026-109618 / CVE-2026-109619 ("PHP2Shell")
;
; Este archivo se carga DESPUÉS de www.conf y zz-docker.conf (orden
; alfabético en /usr/local/etc/php-fpm.d/), así que sus valores ganan.
; FPM mergea las secciones [www] entre archivos del directorio de pools.
;
; Referencia: GHSA-w8hw-w9fx-j79w (CVE-2026-109618) y
; GHSA-6wmf-4rv5-p3rp (CVE-2026-109619).
; ==========================================================================
[www]

; --------------------------------------------------------------------------
; CVE-2026-109619: romper el requisito de "mismo worker"
; --------------------------------------------------------------------------
; El exploit encadena DOS requests seguidas contra el MISMO worker: la
; primera envenena el estado global del proceso, la segunda lo explota.
;
; Con pm.max_requests=1 cada worker atiende una sola request y se recicla,
; así que la condición "mismo worker" es IMPOSIBLE. Es el único valor que
; realmente corta la cadena: con N>1 la ventana sigue abierta, porque la
; probabilidad de que dos requests consecutivas caigan en el mismo worker
; sigue siendo ~1/pm.max_children.
;
; Costo: un fork por request. El OPcache es memoria compartida entre todos
; los workers, así que no se recompila nada; el costo real son unos ms por
; request. Para un panel de administración con tráfico bajo es un precio
; razonable por eliminar una RCE sin autenticación.
pm.max_requests = 1

; --------------------------------------------------------------------------
; CVE-2026-109618: memory_limit=-1 a nivel de pool
; --------------------------------------------------------------------------
; php_admin_value no puede ser sobreescrito por la aplicación (ni por un
; .user.ini ni por un ini_set en runtime). Con -1, una request nunca aborta
; por OOM en mitad de una inicialización, que es el disparador del CVE.
;
; El límite de memoria no desaparece: pasa a ser el cgroup del contenedor
; (mem_limit / memswap_limit en docker-compose.prod.yml), que mata al
; proceso del worker cuando se pasa. Availability boundary en vez de
; corrupción de memoria: ese es el trade-off que pide el advisory.
;
; NO usar RLIMIT_AS ni RLIMIT_DATA: disparan el fallo de allocation que
; lleva a la ruta vulnerable.
php_admin_value[memory_limit] = -1

; Defensa en profundidad: php.ini ya lo desactiva, pero se repite en el
; pool para que ningún directorio, .user.ini o llamada a ini_set() pueda
; volver a encender la feature.
php_admin_flag[session.upload_progress.enabled] = off

; --------------------------------------------------------------------------
; Endurecimiento general del pool
; --------------------------------------------------------------------------
; Cada request ejecuta como máximo un archivo PHP.
security.limit_extensions = .php

; Errores a stderr (el entrypoint de la imagen los captura), nunca a la
; respuesta HTTP.
catch_workers_output = yes
decorate_workers_output = no
