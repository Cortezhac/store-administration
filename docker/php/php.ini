; ==========================================================================
; Configuración PHP del contenedor (store-administratio)
;
; IMPORTANTE: este archivo REEMPLAZA por completo el php.ini de la imagen
; oficial de PHP. Cualquier directive que no esté listada acá usa el valor
; compilado en PHP, no el de php.ini-production.
;
; Hardening para CVE-2026-109618 y CVE-2026-109619 ("PHP2Shell", CVSS 9.2):
;
;   CVE-2026-109618 — corrupción de memoria al abortar una request porque se
;   alcanzó memory_limit. PHP hace longjmp() en el medio de una inicialización
;   (por ejemplo parseando un POST multipart) y el cleanup después interpreta
;   memoria no inicializada como válida → RCE sin autenticación.
;
;   CVE-2026-109619 — estado global obsoleto (use-after-free). Un fatal error
;   deja punteros hacia memoria ya liberada; la request siguiente que toma el
;   mismo worker usa ese estado viejo → RCE sin autenticación.
;
; La VERSIÓN del runtime importa más que cualquier directive: los fixes están
; en 8.4.27 / 8.3.36 / 8.2.35 / 8.5.12. Estas directives son defensa en
; profundidad para las ventanas conocidas de explotación.
; ==========================================================================

; --- Fingerprinting -------------------------------------------------------
; No publicar la versión de PHP en la cabecera X-Powered-By: los escáneres
; automatizados la usan para elegir qué exploit probar contra el worker.
expose_php = Off

; --- CVE-2026-109619: upload progress -------------------------------------
; session.upload_progress.enabled=1 (default de fábrica) hace que PHP
; escriba y deserialice el progreso de las subidas multipart ANTES de que
; corra el script de la aplicación. Ese decoder es el "consumidor temprano"
; que envenena el estado global del worker, y es la vía de explotación
; confirmada en FPM.
;
; La directiva tiene que estar activa ANTES del parseo de la request: va en
; php.ini o en el pool de FPM, nunca en ini_set() ni en un .user.ini.
session.upload_progress.enabled = Off

; --- CVE-2026-109618: control de la request ------------------------------
; memory_limit se deja en 512M acá (valor sano para el contenedor de dev).
; En PRODUCCIÓN el pool de FPM lo fuerza a -1 con php_admin_value para que
; una request NO pueda abortar por OOM en mitad de una inicialización: el
; límite de memoria real pasa a ser el cgroup del contenedor (ver
; mem_limit en docker-compose.prod.yml), que mata al worker en vez de
; corromper el heap.
memory_limit = 512M

; Tope del cuerpo de la request. La app solo sube imágenes de hasta 1 MB
; (validación 'max:1024' en el form de Categoría), así que 8M es holgado.
; upload_max_filesize tiene que quedar POR DEBAJO de post_max_size.
post_max_size = 8M
upload_max_filesize = 4M

; Tope de campos POST, de partes multipart y de anidamiento: acota el
; trabajo que puede llegar a hacer el parser de la request, que es
; justamente el punto de entrada del exploit.
max_input_vars = 1000
max_file_uploads = 10
max_input_nesting_level = 64

; --- Uploads --------------------------------------------------------------
file_uploads = On
max_execution_time = 300
