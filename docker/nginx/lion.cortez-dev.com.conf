# Vhost interno del container store-nginx (escucha solo en la red Docker)
# El TLS lo termina el nginx-proxy central, que reenvía por HTTP interno.

server {
    listen 80;
    server_name lion.cortez-dev.com;

    root /var/www/app/public;
    index index.php;

    charset utf-8;

    # --- Límites de la request (CVE-2026-109618) --------------------------
    # El borde recorta lo que llega a parsear PHP. Tiene que estar alineado
    # con post_max_size del contenedor (8M): si nginx aceptara más que PHP,
    # PHP vería un body recortado y el tamaño real quedaría fuera del
    # control de la aplicación.
    client_max_body_size 8M;

    # El body se bufferea en disco apenas pasa este tamaño: un body enorme
    # no se mantiene en memoria del worker.
    client_body_buffer_size 128k;

    # Tope del tamaño de las cabeceras. nginx ya limita a 100 campos por
    # request; con buffers chicos se acota también el tamaño de cada uno.
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # Cabeceras que llegan del nginx-proxy central (para que Laravel detecte HTTPS
    # y la IP real del cliente vía trusted proxies)
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass web:9000; # 'web' se resuelve por DNS en la red default del proyecto
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloquear archivos ocultos (dotfiles), excepto well-known (ACME)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}