services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
  nginx:
    image: nginx:alpine
    container_name: store-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  db:
    # En producción NO exponemos el puerto 5433 al exterior por seguridad
    restart: always
