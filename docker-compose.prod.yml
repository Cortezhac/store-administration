services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    # --- Availability boundary para CVE-2026-109618 ------------------------
    # El pool de FPM fuerza memory_limit=-1 para que una request nunca
    # aborte por OOM en mitad de una inicialización (la ruta vulnerable).
    # El límite de memoria real pasa a ser el cgroup: cuando PHP se pasa,
    # el kernel mata al proceso en vez de corromper el heap.
    #
    # memswap_limit == mem_limit desactiva el swap a propósito, así el
    # OOM killer actúa de forma determinista en vez de tener al worker
    # swapeando hasta el límite.
    mem_limit: 1g
    memswap_limit: 1g
    networks:
      - default # Red del proyecto: comunicación con db y store-nginx por DNS
    volumes:
      - ./.env:/var/www/app/.env:ro # APP_KEY, APP_ENV, DB_* (no van en la imagen por .dockerignore)
      - store-storage:/var/www/app/storage # Persistencia de uploads, logs y cache de Laravel
      - store-build:/var/www/app/public/build # Assets compilados en la imagen, sincronizados por el entrypoint

  nginx:
    image: nginx:alpine
    container_name: store-nginx
    restart: unless-stopped
    depends_on:
      - web # Garantiza que web arranque primero y sincronice los assets al volumen
    networks:
      - default # Para resolver 'web' (php-fpm) por DNS y servir los estáticos
      - web     # Para que el nginx-proxy central lo resuelva como 'store-nginx'
    volumes:
      - ./:/var/www/app:ro # Código + resto de estáticos (public/), salvo build que viene del volumen
      - store-build:/var/www/app/public/build:ro # Assets compilados, producidos por Dockerfile.prod
      - ./docker/nginx/lion.cortez-dev.com.conf:/etc/nginx/conf.d/lion.cortez-dev.com.conf:ro

  db:
    # En producción NO exponemos el puerto 5433 al exterior por seguridad
    restart: always

volumes:
  store-storage:
  store-build:

networks:
  web:
    external: true