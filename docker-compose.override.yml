services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile # Dockerfile con Node, pnpm y artisan serve
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www/app
      - /var/www/app/node_modules
    networks:
      - default # Necesaria para que siga hablando con store-db (postgres)
      - web     # Red externa del nginx-proxy central, para que resuelva 'store-web' por DNS

  db:
    ports:
      - "5433:5432" # Expone la BD a tu DBeaver local

networks:
  web:
    external: true
